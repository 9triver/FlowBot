<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务部表格业务处理</title>
  <link rel="stylesheet" href="toolbox_style.css">
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --accent-color: #00b1ba;
      --light-color: #ecf0f1;
      --dark-color: #34495e;
      --success-color: #2ecc71;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      --border-radius: 6px;
    }

    html,
    body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background-color: #f5f7fa;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px 20px;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    #header p {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #blocklyDiv {
      flex: 0 0 70%;
      height: 100%;
      background: white;
      border-right: 1px solid #ddd;
    }

    .sidebar {
      flex: 0 0 30%;
      display: flex;
      flex-direction: column;
      padding: 15px;
      background-color: white;
      overflow-y: auto;
    }

    .code-container {
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.9rem;
      resize: vertical;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }

    #generatedCodeContainer {
      height: 150px;
    }

    #generatedFilePath {
      height: 80px;
    }

    #ai-response {
      height: 120px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    .button-row {
      display: flex;
      width: 100%;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: var(--border-radius);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
      text-align: center;
      min-width: 120px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .btn-primary {
      background-color: var(--secondary-color);
    }

    .btn-success {
      background-color: var(--success-color);
    }

    .btn-warning {
      background-color: var(--warning-color);
    }

    .btn-danger {
      background-color: var(--danger-color);
    }

    .btn-accent {
      background-color: var(--accent-color);
    }

    .ai-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    #ai-command {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }

    .section-title {
      font-size: 1rem;
      color: var(--dark-color);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .ai-response-container {
      margin-top: 10px;
    }

    @media (max-width: 1200px) {
      #blocklyDiv {
        flex: 0 0 60%;
      }
      
      .sidebar {
        flex: 0 0 40%;
      }
    }

    @media (max-width: 992px) {
      .main-content {
        flex-direction: column;
      }
      
      #blocklyDiv, .sidebar {
        flex: 1 1 100%;
      }
      
      #blocklyDiv {
        height: 50%;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }
    }
  </style>
</head>

<body onload="start()">
  <xml id="toolbox-categories" style="display: none">
    <toolboxlabel name="Custom Toolbox" colour="darkslategrey"></toolboxlabel>
    <category name="赋值" categorystyle="variable_category">
      <block type="setto"></block>
    </category>
    <category name="工作簿操作" categorystyle="logic_category">
      <!-- <block type="text"></block> -->
      <block type="openWorkbook"></block>
      <block type="addWorkbook"></block>
      <block type="saveWorkbook"></block>
    </category>
    <category name="行、列操作" categorystyle="loop_category">
      <!-- <block type="math_number" gap="32">
        <field name="NUM">0</field>
      </block> -->
      <block type="fetchRowNoheader"></block>
      <block type="fetchRow"></block>
      <block type="fetchCol"></block>

      <block type="WriteRowNoheader"></block>
      <block type="WriteRow"></block>
      <block type="WriteCol"></block>
      
      <block type="InsertRowBefore"></block>
      <block type="InsertColBefore"></block>
    </category>
    <category name="其他表格操作" categorystyle="loop_category">
      <block type="fetchCell"></block>
      <block type="fetchArea"></block>
      <block type="SetCellValue"></block>
      <block type="SetAreaText"></block>
    </category>
    <category name="工作表操作" categorystyle="math_category">
      <block type="CreateSheet"></block>
      <block type="SetActiveSheet"></block>
    </category>
    <category name="表格集合操作" categorystyle="procedure_category">
      <!-- <block type="text"></block> -->
      <block type="MakeWorkbookDict"></block>
      <block type="SetDictHeaders"></block>
      <block type="AddRowDict"></block>
      <block type="SetDictColText"></block>
      <block type="GenerateFile"></block>
      <block type="getAllWorkbook"></block>
    </category>
    <category name="辅助功能" categorystyle="variable_category">
      <block type="SettoNum"></block>
      <block type="SettoString"></block>
      <block type="GetStringLength"></block>
      <block type="SubString"></block>
      <block type="TeleVerify"></block>
      <block type="LeftJust"></block>
    </category>
    <category name="条件语句" categorystyle="text_category">
      <block type="IF"></block>
      <block type="Elif"></block>
      <block type="Else"></block>
    </category>
    <category name="循环" categorystyle="list_category">
      <block type="For"></block>
      <block type="Foreach"></block>
      <block type="While"></block>
    </category>
    <category name="逻辑块" categorystyle="procedure_category">
      <block type="Compare"></block>
      <block type="isNone"></block>
      <block type="and"></block>
      <block type="or"></block>
      <block type="not"></block>
    </category>
  </xml>

  <div class="app-container">
    <div id="header">
      <p>财务部表格业务处理</p>
    </div>

    <div class="main-content">
      <div id="blocklyDiv"></div>
      
      <div class="sidebar">
        <div class="code-container">
          <div class="section-title">生成的代码</div>
          <textarea id="generatedCodeContainer" readonly placeholder="生成的Python代码将显示在这里..."></textarea>
        </div>
        
        <div class="code-container">
          <div class="section-title">文件路径</div>
          <textarea id="generatedFilePath" readonly placeholder="文件路径将显示在这里..."></textarea>
        </div>
        
        <div class="button-group">
          <div class="button-row">
            <input id="loadfilepath" class="btn btn-primary" type="button" value="选择文件">
            <input id="loadfilefolder" class="btn btn-primary" type="button" value="选择文件夹">
          </div>
          
          <div class="button-row">
            <input id="load" class="btn btn-success" type="button" value="加载">
            <input id="empty" class="btn btn-warning" type="button" value="清空">
          </div>
          
          <div class="button-row">
            <input id="save" class="btn btn-accent" type="button" value="保存">
          </div>
          
          <div class="button-row">
            <input id="test" class="btn btn-primary" type="button" value="查看生成代码">
            <input id="run" class="btn btn-success" type="button" value="运行">
          </div>
        </div>
        
        <div class="ai-section">
          <div class="section-title">AI辅助功能</div>
          <input id="ai-command" type="text" placeholder="请输入AI指令...">
          
          <div class="button-row">
            <input id="ai" class="btn btn-accent" type="button" value="AI生成">
          </div>
          
          <div class="ai-response-container">
            <div class="section-title">AI回复</div>
            <textarea id="ai-response" readonly placeholder="AI回复内容将显示在这里..."></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./node_modules/blockly/blockly_compressed.js"></script>
  <script src="./node_modules/blockly/blocks_compressed.js"></script>
  <script src="./node_modules/blockly/javascript_compressed.js"></script>
  <script src="./node_modules/blockly/python_compressed.js"></script>
  <script src="./node_modules/blockly/msg/en.js"></script>
  <script src="CustomCategory.js"></script>
  <script src="./index.js"></script>
  <script src="./btn.js"></script>
  <script src="./AIcommand.js"></script>
</body>

</html>
